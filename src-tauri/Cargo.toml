[package]
name = "netrelish"
version = "0.1.0"
description = "NetRelish — the browser for people who build the web"
authors = ["NetRelish"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "netrelish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` unlocks Window::add_child — required to embed a real WKWebView
# for page rendering. Without it you are stuck with iframes, which most of
# the web refuses to load (X-Frame-Options / frame-ancestors).
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
