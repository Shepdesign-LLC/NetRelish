[package]
name = "netrelish"
version = "0.1.0"
description = "NetRelish — the browser for people who build the web"
authors = ["NetRelish"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "netrelish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` unlocks Window::add_child — required to embed a real WKWebView
# for page rendering. Without it you are stuck with iframes, which most of
# the web refuses to load (X-Frame-Options / frame-ancestors).
tauri = { version = "2", features = ["macos-private-api", "unstable", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Match tauri-plugin-sql's sqlx so both talk to the same pool type.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time"] }
# The organization engine (week 6): local ONNX embeddings + vector search.
ort = "2.0.0-rc.10"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
sqlite-vec = "0.1"
libsqlite3-sys = "0.30"
regex = "1"
thiserror = "2"
url = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
