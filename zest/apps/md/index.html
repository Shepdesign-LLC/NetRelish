<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zest MD — Markdown reader &amp; HTML exporter</title>
<meta name="color-scheme" content="light dark">
<meta name="description" content="A local-first Markdown reader and HTML exporter. Nothing uploaded. Code, math, diagrams, tables — typeset and exportable.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181c22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zest MD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" crossorigin="anonymous">

<!-- ===== Document styles (also inlined into exports) ===== -->
<style id="doc-css">
:root{
  --paper:#f2f3f5; --sheet:#ffffff; --ink:#1b2130; --ink-2:#4b5363; --ink-3:#5f6879; /* ink-3: 4.58:1 worst-case on the light surfaces — small helper text needs 4.5:1 */
  --rule:#dde0e6; --accent:#1f4ed8; --accent-soft:#e8eefc; --code-bg:#f5f6f9;
  --on-accent:#ffffff; --radius:8px;
  --c-comment:#5f6879; --c-kw:#7c3aed; --c-str:#0f766e; --c-num:#b45309; --c-fn:#1f4ed8; --c-var:#be123c;
  --doc-font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ui-font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --doc-size:17px; --doc-lh:1.65; --measure:70ch;
}
html[data-theme="dark"]{
  --paper:#111419; --sheet:#181c22; --ink:#e7e9ee; --ink-2:#b4bac6; --ink-3:#7c8494;
  --rule:#2a3039; --accent:#8fb0ff; --accent-soft:#1d2740; --code-bg:#12151b; --on-accent:#0f1420;
  --c-comment:#7c8494; --c-kw:#c4a7ff; --c-str:#7fd6c6; --c-num:#f2b56b; --c-fn:#8fb0ff; --c-var:#ff8fa8;
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --paper:#111419; --sheet:#181c22; --ink:#e7e9ee; --ink-2:#b4bac6; --ink-3:#7c8494;
    --rule:#2a3039; --accent:#8fb0ff; --accent-soft:#1d2740; --code-bg:#12151b; --on-accent:#0f1420;
    --c-comment:#7c8494; --c-kw:#c4a7ff; --c-str:#7fd6c6; --c-num:#f2b56b; --c-fn:#8fb0ff; --c-var:#ff8fa8;
  }
}
.doc{
  font-family:var(--doc-font); font-size:var(--doc-size); line-height:var(--doc-lh);
  color:var(--ink); max-width:var(--measure); margin:0 auto; padding:56px 32px 120px;
  overflow-wrap:anywhere; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.doc > :first-child{margin-top:0}
.doc h1,.doc h2,.doc h3,.doc h4,.doc h5,.doc h6{font-weight:600; line-height:1.2; margin:2em 0 .6em; letter-spacing:-.01em; scroll-margin-top:80px}
.doc h1{font-size:2.35em; font-weight:700; letter-spacing:-.02em; margin-top:.4em}
.doc h2{font-size:1.65em; padding-bottom:.25em; border-bottom:1px solid var(--rule)}
.doc h3{font-size:1.3em}
.doc h4{font-size:1.1em}
.doc h5,.doc h6{font-size:1em; color:var(--ink-2)}
.doc p{margin:0 0 1.1em}
.doc a{color:var(--accent); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.15em}
.doc a:hover{text-decoration-thickness:2px}
.doc strong{font-weight:700}
.doc em{font-style:italic}
.doc hr{border:0; height:1px; background:var(--rule); margin:3em auto; width:40%}
.doc ul,.doc ol{padding-left:1.5em; margin:0 0 1.1em}
.doc li{margin:.25em 0}
.doc li > p{margin-bottom:.4em}
.doc li.task{list-style:none; margin-left:-1.5em; padding-left:1.5em; position:relative}
.doc li.task input{position:absolute; left:0; top:.4em; margin:0; accent-color:var(--accent)}
.doc li.task.done > span{color:var(--ink-3); text-decoration:line-through}
.doc blockquote{margin:1.4em 0; padding:.2em 0 .2em 1.2em; border-left:3px solid var(--accent); color:var(--ink-2)}
.doc blockquote p:last-child{margin-bottom:0}
.doc img{max-width:100%; height:auto; border-radius:calc(var(--radius)*.75); display:block; margin:1.4em auto}
.doc figure{margin:1.6em 0}
.doc figcaption{font-size:.85em; color:var(--ink-3); text-align:center; margin-top:.5em}
.doc code{font-family:var(--mono); font-size:.86em; background:var(--code-bg); border:1px solid var(--rule); border-radius:calc(var(--radius)/2); padding:.1em .38em}
.doc pre{background:var(--code-bg); border:1px solid var(--rule); border-radius:var(--radius); padding:16px 18px; overflow-x:auto; margin:1.4em 0; line-height:1.55; font-size:.86em; position:relative}
.doc pre code{background:none; border:0; padding:0; font-size:1em; white-space:pre}
.doc .pre-tools{position:absolute; top:8px; right:8px; display:flex; gap:8px; align-items:center; font:500 11px/1 var(--ui-font)}
.doc .pre-tools .lang{color:var(--ink-3); letter-spacing:.02em}
.doc .copy{font:500 11px/1 var(--ui-font); color:var(--ink-2); background:var(--sheet); border:1px solid var(--rule); border-radius:calc(var(--radius)/2); padding:5px 9px; cursor:pointer; transition:opacity .12s,color .12s,background .12s} /* ink-2, no opacity dimming: the only token passing 4.5:1 on sheet in every skin (ink-3 fails in six of seven) */
.doc pre:hover .copy,.doc .table-wrap:hover .copy,.doc .diagram:hover .copy,.doc .copy:focus-visible,.doc .copy:hover{opacity:1}
.doc .copy:hover{color:var(--accent); border-color:var(--accent)}
.doc .copy.done{color:var(--on-accent); background:var(--accent); border-color:var(--accent); opacity:1}
.doc .diagram{position:relative; margin:1.6em 0}
.doc .diagram .copy{position:absolute; top:0; right:0; z-index:1}
.doc .table-wrap{overflow-x:auto; margin:1.4em 0; position:relative}
.doc .table-wrap .copy{position:absolute; top:6px; right:6px}
.doc .table-wrap.has-copy{padding-top:30px}
.doc table{border-collapse:collapse; width:100%; font-size:.92em; font-variant-numeric:tabular-nums}
.doc th,.doc td{padding:.55em .8em; border-bottom:1px solid var(--rule); text-align:left; vertical-align:top; overflow-wrap:normal; word-break:normal; min-width:6ch}
.doc th{white-space:nowrap}
.doc th{font-weight:600; border-bottom:2px solid var(--ink-2)}
.doc tbody tr:nth-child(even){background:color-mix(in srgb,var(--rule) 30%,transparent)}
.doc kbd{font-family:var(--mono); font-size:.8em; padding:.1em .4em; border:1px solid var(--rule); border-bottom-width:2px; border-radius:4px; background:var(--sheet)}
.doc mark{background:var(--accent-soft); color:inherit; padding:0 .15em}
.doc details{border:1px solid var(--rule); border-radius:var(--radius); padding:.6em 1em; margin:1.2em 0}
.doc summary{cursor:pointer; font-weight:600}
.doc .mermaid{display:flex; justify-content:center; margin:0; background:transparent}
.doc .mermaid svg{max-width:100%; height:auto}
.doc .footnotes{font-size:.85em; color:var(--ink-2); border-top:1px solid var(--rule); margin-top:3em; padding-top:1em}
.doc .frontmatter{font-family:var(--ui-font); font-size:.8em; color:var(--ink-3); margin:0 0 2em; display:flex; flex-wrap:wrap; gap:.4em 1.4em}
.doc .frontmatter span b{color:var(--ink-2); font-weight:500; margin-right:.35em}
.doc .katex-display{overflow-x:auto; overflow-y:hidden; padding:.3em 0}
.to-top{position:fixed; right:22px; bottom:22px; width:40px; height:40px; border-radius:999px; background:var(--sheet); color:var(--ink-2); border:1px solid var(--rule); box-shadow:0 6px 20px -6px rgba(10,14,24,.35); display:grid; place-items:center; cursor:pointer; opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .18s,transform .18s,color .12s,border-color .12s; z-index:40}
.to-top.show{opacity:1; transform:none; pointer-events:auto}
.to-top:hover{color:var(--accent); border-color:var(--accent)}
.to-top svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
@media print{.to-top{display:none}}
.doc .anchor{opacity:0; margin-left:.35em; font-size:.7em; text-decoration:none; color:var(--ink-3)}
.doc h1:hover .anchor,.doc h2:hover .anchor,.doc h3:hover .anchor,.doc h4:hover .anchor{opacity:1}
/* highlight.js tokens */
.hljs-comment,.hljs-quote{color:var(--c-comment); font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-meta,.hljs-doctag,.hljs-tag{color:var(--c-kw)}
.hljs-string,.hljs-attr,.hljs-addition,.hljs-regexp,.hljs-symbol,.hljs-bullet{color:var(--c-str)}
.hljs-number,.hljs-literal,.hljs-built_in,.hljs-type{color:var(--c-num)}
.hljs-title,.hljs-section,.hljs-name,.hljs-selector-id,.hljs-selector-class,.hljs-function .hljs-title{color:var(--c-fn)}
.hljs-variable,.hljs-template-variable,.hljs-deletion,.hljs-attribute{color:var(--c-var)}
.hljs-emphasis{font-style:italic}.hljs-strong{font-weight:700}
@media print{
  .doc{max-width:none; padding:0; font-size:11.5pt; color:#000}
  .doc pre{white-space:pre-wrap; border-color:#bbb}
  .doc a{color:#000}
  .doc h2{page-break-after:avoid} .doc pre,.doc table,.doc img{page-break-inside:avoid}
  .doc .copy{display:none} .doc .table-wrap.has-copy{padding-top:0}
}
</style>

<!-- ===== App chrome ===== -->
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--ui-font); font-size:14px; overflow:hidden}
button,select,input{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.app{display:grid; grid-template-rows:52px 1fr; height:100%}

/* toolbar */
/* The chrome wears lime (fruits.json) — tokens scoped to the bar, so the document below keeps its skins */
.bar{--paper:#0c1708; --sheet:#15230f; --ink:#eef4e6; --ink-2:#b8c6ab; --ink-3:#93a487; --rule:#2b3b22; --accent:#4fbf3a; --accent-soft:#1a3012; --on-accent:#070f06; --code-bg:#0e1b0a;
  display:flex; align-items:center; gap:6px; padding:0 14px; color:var(--ink); background:var(--sheet); border-bottom:1px solid var(--rule); position:relative; z-index:5} /* color re-anchored: inherited color resolves above the scope */
.bar .btn.primary{background:var(--accent); color:var(--on-accent); font-weight:600}
.bar .btn.primary:hover{background:var(--accent); color:var(--on-accent); filter:brightness(1.1)}
.brand{display:flex; align-items:center; gap:9px; margin-right:10px; font-weight:600; letter-spacing:-.01em; white-space:nowrap}
.brand .mark{width:34px; height:34px; border-radius:9px; display:block; box-shadow:0 4px 12px -4px rgba(0,0,0,.5)}
.brand .tag{font:500 10.5px var(--mono,ui-monospace,monospace); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin-left:4px}
@media(max-width:1180px){.brand .tag{display:none}}
.tabs{display:flex; gap:2px; overflow-x:auto; flex:1; min-width:0; scrollbar-width:none; align-self:stretch; align-items:end}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex; align-items:center; gap:6px; padding:8px 8px 8px 12px; margin-bottom:-1px; border-radius:8px 8px 0 0; color:var(--ink-2); white-space:nowrap; max-width:240px; border:1px solid var(--rule); border-bottom:0; cursor:default; background:color-mix(in srgb,var(--paper) 45%,var(--sheet))}
.tab span{overflow:hidden; text-overflow:ellipsis}
.tab:hover{background:color-mix(in srgb,var(--paper) 75%,var(--sheet)); color:var(--ink)}
.tab[aria-selected="true"],.tab[aria-selected="true"]:hover{background:var(--paper); color:var(--ink); font-weight:500; box-shadow:inset 0 3px 0 var(--accent)}
.tab .x,.tab .lk{width:20px; height:20px; border-radius:5px; display:grid; place-items:center; color:var(--ink-3); flex:none}
.tab .x:hover,.tab .lk:hover{background:var(--rule); color:var(--ink)}
.tab .lk{opacity:0}
.tab:hover .lk,.tab .lk:focus-visible,.tab[data-locked="true"] .lk{opacity:1}
.tab[data-locked="true"] .lk{color:var(--accent)}
.tab[data-locked="true"] .x{display:none}
.tab .lk svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.group{display:flex; align-items:center; gap:2px; padding:0 6px; border-left:1px solid var(--rule)}
.group:first-of-type{border-left:0}
.btn{display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 10px; border-radius:6px; color:var(--ink-2); white-space:nowrap}
.btn:hover{background:var(--paper); color:var(--ink)}
.btn[aria-pressed="true"],.btn[aria-pressed="true"]:hover{background:var(--accent-soft); color:var(--accent)}
.btn.primary{background:var(--ink); color:var(--sheet); font-weight:500}
.btn.primary:hover{background:var(--accent); color:var(--on-accent)}
.btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
.btn.icon{width:32px; padding:0; justify-content:center}
.label{display:none}
@media (min-width:1100px){.label{display:inline}}

/* popovers */
.pop{position:absolute; top:46px; right:14px; background:var(--sheet); border:1px solid var(--rule); border-radius:10px; box-shadow:0 12px 32px -8px rgba(10,14,24,.25); padding:8px; min-width:230px; display:none; z-index:20; max-height:calc(100vh - 60px); overflow:auto}
.pop[data-open="true"]{display:block}
.pop .row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 8px; border-radius:6px}
.pop .row:hover{background:var(--paper)}
.pop .row label{color:var(--ink-2)}
.pop .seg{display:flex; gap:2px; background:var(--paper); border-radius:6px; padding:2px}
.pop .seg button{padding:4px 9px; border-radius:4px; color:var(--ink-2)}
.pop .seg button:hover{color:var(--ink)}
.pop .seg button[aria-pressed="true"]{background:var(--sheet); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12)}
.skins{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:4px 4px 6px}
.skin{display:flex; flex-direction:column; gap:6px; padding:8px 10px; border:1px solid var(--rule); border-radius:8px; text-align:left; color:var(--ink-2)}
.skin:hover{color:var(--ink); border-color:var(--ink-3)}
.skin[aria-pressed="true"]{border-color:var(--accent); color:var(--ink); box-shadow:inset 0 0 0 1px var(--accent)}
.skin b{font-weight:600; font-size:13px}
.skin .chips{display:flex; gap:3px}
.skin .chips i{width:14px; height:14px; border-radius:4px; border:1px solid rgba(0,0,0,.12)}
.skin small{font-size:11px; color:var(--ink-3)}
.pop .head{font-size:12px; color:var(--ink-3); padding:8px 8px 4px}
.custom{display:none; flex-direction:column; gap:2px; padding:0 0 6px}
.custom[data-open="true"]{display:flex}
.custom input[type=color]{width:38px; height:24px; border:1px solid var(--rule); border-radius:6px; padding:1px 2px; background:var(--paper); cursor:pointer}
.custom select{background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:3px 6px; color:var(--ink); max-width:160px}
.custom .menu button{font-size:13px}
.pop input[type=range]{width:110px; accent-color:var(--accent)}
.pop .menu button{display:flex; width:100%; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; text-align:left}
.pop .menu button:hover{background:var(--paper); color:var(--ink)}
.pop .menu button small{margin-left:auto; color:var(--ink-3); font-family:var(--mono); font-size:11px}
.pop hr{border:0; border-top:1px solid var(--rule); margin:6px 0}

/* workspace */
.work{display:grid; grid-template-columns:0 0 1fr; min-height:0; transition:grid-template-columns .18s ease}
.work[data-toc="true"]{grid-template-columns:240px 0 1fr}
.work[data-edit="true"]{grid-template-columns:0 minmax(320px,44%) 1fr}
.work[data-toc="true"][data-edit="true"]{grid-template-columns:240px minmax(320px,40%) 1fr}
.toc{overflow:auto; border-right:1px solid var(--rule); background:var(--sheet); padding:18px 8px 40px; min-width:0}
.toc h4{margin:0 0 8px 10px; font-size:12px; font-weight:500; color:var(--ink-3)}
.toc a{display:block; padding:5px 10px; border-radius:6px; color:var(--ink-2); text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px}
.toc a:hover{background:var(--paper); color:var(--ink)}
.toc a[data-level="3"]{padding-left:22px} .toc a[data-level="4"]{padding-left:34px; font-size:12px}
.toc .empty{color:var(--ink-3); font-size:13px; padding:10px}
.editor{border-right:1px solid var(--rule); background:var(--sheet); display:flex; flex-direction:column; min-width:0; overflow:hidden}
.editor textarea{flex:1; width:100%; resize:none; border:0; outline:0; background:transparent; color:var(--ink); font:13.5px/1.6 var(--mono); padding:20px 22px; tab-size:2}
.editor .meta{padding:6px 12px; font-size:12px; color:var(--ink-3); border-top:1px solid var(--rule); display:flex; gap:14px}
.stage{overflow:auto; position:relative; min-width:0}
.stage.drag{outline:3px dashed var(--accent); outline-offset:-12px; background:var(--accent-soft)}

/* empty state */
.empty-state{max-width:640px; margin:0 auto; padding:12vh 32px 80px; font-family:var(--doc-font)}
.empty-state .appmark{width:56px; height:56px; border-radius:14px; display:block; margin:0 0 22px; box-shadow:0 12px 32px -12px rgba(7,15,6,.5)}
.empty-state h1{font-size:44px; line-height:1.05; font-weight:700; letter-spacing:-.025em; margin:0 0 20px}
.empty-state p{font-size:19px; line-height:1.55; color:var(--ink-2); margin:0 0 28px}
.empty-state .actions{display:flex; gap:10px; flex-wrap:wrap; font-family:var(--ui-font)}
.empty-state .actions .btn{height:40px; padding:0 16px; border:1px solid var(--rule); background:var(--sheet); color:var(--ink-2)}
.empty-state .actions .btn:hover{background:var(--paper); border-color:var(--ink-3); color:var(--ink)}
.empty-state .actions .btn.primary{background:var(--ink); border-color:var(--ink); color:var(--sheet)}
.empty-state .actions .btn.primary:hover{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.empty-state .hint{margin-top:44px; font:13px/1.6 var(--ui-font); color:var(--ink-3)}
.empty-state .hint b{font-weight:500; color:var(--ink-2)}
.empty-state kbd{font-family:var(--mono); font-size:11px; padding:1px 5px; border:1px solid var(--rule); border-bottom-width:2px; border-radius:4px}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(8px); background:var(--ink); color:var(--sheet); padding:9px 14px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:.18s; z-index:50; display:flex; align-items:center; gap:14px}
.toast.show{opacity:1; transform:translateX(-50%); pointer-events:auto}
.toast button{color:var(--accent); font-weight:600; padding:2px 4px; border-radius:4px}
.toast button:hover{text-decoration:underline}
.sr{position:absolute; left:-9999px}
@media (max-width:760px){
  .work[data-toc="true"]{grid-template-columns:0 0 1fr}
  .work[data-edit="true"]{grid-template-columns:0 1fr 0}
  .doc{padding:32px 20px 100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{overflow:visible; background:#fff}
  .bar,.toc,.editor,.toast,.pop{display:none!important}
  .app{display:block} .work{display:block} .stage{overflow:visible}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><img class="mark" src="icons/icon-192.png" alt="" aria-hidden="true">Zest MD<span class="tag">lime · read like it was typeset</span></div>
    <div class="tabs" id="tabs" role="tablist"></div>

    <div class="group">
      <button class="btn" id="btnOpen" title="Open Markdown files (Ctrl/⌘ O)">
        <svg viewBox="0 0 24 24"><path d="M4 6h5l2 2h9v10H4z"/></svg><span class="label">Open</span>
      </button>
      <button class="btn" id="btnPaste" title="Paste Markdown from clipboard">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="15" rx="2"/><path d="M9 5V3h6v2"/></svg><span class="label">Paste</span>
      </button>
      <button class="btn" id="btnEdit" aria-pressed="false" title="Toggle editor (Ctrl/⌘ E)">

        <svg viewBox="0 0 24 24" id="themeIcon"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="group">
      <button class="btn primary" id="btnExport" title="Export">
        <svg viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>Export

    <!-- reader settings -->
    <div class="pop" id="popRead" style="right:110px; min-width:300px">
      <div class="head">Skin</div>
      <div class="skins" id="skins"></div>
      <div class="custom" id="custom">
        <div class="head">Custom skin</div>
        <div class="row"><label>Page</label><input type="color" data-c="paper"></div>
        <div class="row"><label>Sheet</label><input type="color" data-c="sheet"></div>
        <div class="row"><label>Ink</label><input type="color" data-c="ink"></div>
        <div class="row"><label>Accent</label><input type="color" data-c="accent"></div>
        <div class="row"><label>Body type</label><select data-c="doc"></select></div>
        <div class="row"><label>Interface type</label><select data-c="ui"></select></div>
        <div class="row"><label>Code type</label><select data-c="mono"></select></div>
        <div class="row"><label>Corners</label><input type="range" data-c="radius" min="0" max="16" step="1"></div>
        <div class="menu"><button id="btnFromSkin">Start from the last preset</button><button id="btnImportBrand">Import zest-brand.json</button></div>
        <input type="file" id="brandFile" accept=".json,application/json" hidden>
      </div>
      <div class="head">Reading</div>
      <div class="row"><label>Mode</label>
        <div class="seg" data-set="theme">
          <button data-v="auto">Auto</button>
          <button data-v="light">Light</button>
          <button data-v="dark">Dark</button>
        </div>
      </div>
      <div class="row"><label>Typeface</label>
        <div class="seg" data-set="font">
          <button data-v="skin" aria-pressed="true">Skin</button>
          <button data-v="sans" style="font-family:'Geist',sans-serif">Sans</button>
          <button data-v="serif" style="font-family:'Newsreader',serif">Serif</button>
          <button data-v="mono" style="font-family:'Geist Mono',monospace">Mono</button>
        </div>
      </div>
      <div class="row"><label>Size</label><input type="range" data-set="size" min="14" max="26" step="1" value="17"></div>
      <div class="row"><label>Line height</label><input type="range" data-set="lh" min="1.3" max="2" step="0.05" value="1.65"></div>
      <div class="row"><label>Width</label><input type="range" data-set="measure" min="50" max="110" step="2" value="70"></div>
      <hr>
      <div class="row"><label for="cleanLLM">Clean LLM paste</label><input type="checkbox" id="cleanLLM" checked></div>

      <hr>
      <div class="menu"><button id="btnReset">Reset reader settings</button></div>
    </div>

    <!-- export menu -->

      <div class="menu">
        <button data-do="html">Download self-contained HTML <small>⌘S</small></button>
        <button data-do="copyhtml">Copy HTML fragment</button>
        <button data-do="pdf">Print / save as PDF <small>⌘P</small></button>
        <hr>
        <button data-do="md">Download cleaned Markdown</button>
        <button data-do="copymd">Copy Markdown</button>
      </div>
    </div>

  /* ---------- storage (safe everywhere) ---------- */

    get(k, d) { try { const v = localStorage.getItem('mdpress:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('mdpress:' + k, JSON.stringify(v)); } catch {} }
  };

  /* ---------- state ---------- */
  const state = {
    files: [],            // {id, name, text}
    active: -1,
    settings: Object.assign({ skin: 'press', font: 'skin', size: 17, lh: 1.65, measure: 70, theme: 'auto', custom: { paper: '#f2f3f5', sheet: '#ffffff', ink: '#1b2130', accent: '#1f4ed8', doc: 'geist', ui: 'geist', mono: 'geistMono', radius: 8 }, cleanLLM: true, rawHtml: true, toc: false, edit: false }, store.get('settings', {}))

      // the apps share one origin (§8), so an unsanitized document could read every tool's storage
      html: state.settings.rawHtml && has.pure, linkify: true, typographer: true, breaks: false,

    download(f.name.replace(/\.(md|markdown|mdx|txt)$/i, '') + '.html', html, 'text/html');

  });
