name: CI

# Runs on every push and PR. Five things must hold:
#   1. generated files match their sources (Tokens.swift, Symbols.swift, Sources/Pantry/Models, NetRelish.xcodeproj and its plists),
#      and the vendored defuddle.js matches its recorded checksum
#   2. both product flavors build — AppStore and Direct (DIRECT_BUILD)
#   3. the tests pass (hosted NetRelishTests + unhosted GeneratorTests)
#   4. the non-negotiable-5 gate still enforces what it claims to
#   5. the Pantry core builds, tests and iOS-compiles as the PantryKit package (ADR 0009)

# Read-only token. Every job here checks out, regenerates, builds or tests —
# nothing writes back to the repository. Without this block the workflow
# inherits the repository default for GITHUB_TOKEN, which may be write-all.
# (upload-artifact in `test` uses ACTIONS_RUNTIME_TOKEN, a separate credential,
# so it is unaffected by this scope.)
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # regen-project.yml starts CI here after committing a regenerated project, because a
  # push made with a workflow's own token starts no workflows.
  workflow_dispatch:

env:
  DERIVED: .build/DerivedData

jobs:
  generated-files:
    name: Generated files match their sources
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false   # read-only job: leave no token in .git/config
      - name: Regenerate Tokens.swift and Symbols.swift
        run: |
          swift scripts/gen-tokens.swift design/tokens.css > /tmp/Tokens.swift
          swift scripts/gen-symbols.swift design/symbols.svg design/logo.svg design/logo-cog.svg > /tmp/Symbols.swift
          diff -u Sources/UI/Tokens.swift /tmp/Tokens.swift || { echo "::error file=Sources/UI/Tokens.swift::stale — swift scripts/gen-tokens.swift design/tokens.css > Sources/UI/Tokens.swift"; exit 1; }
          diff -u Sources/UI/Symbols.swift /tmp/Symbols.swift || { echo "::error file=Sources/UI/Symbols.swift::stale — swift scripts/gen-symbols.swift design/symbols.svg design/logo.svg design/logo-cog.svg > Sources/UI/Symbols.swift"; exit 1; }
      - name: Regenerate Sources/Pantry/Models
        run: |
          swift scripts/gen-pantry.swift design/NetRelish.json /tmp/PantryModels
          diff -ru Sources/Pantry/Models /tmp/PantryModels || { echo "::error file=design/NetRelish.json::Sources/Pantry/Models is stale — swift scripts/gen-pantry.swift design/NetRelish.json Sources/Pantry/Models"; exit 1; }
      - name: Regenerate NetRelish.xcodeproj
        run: |
          brew install xcodegen >/dev/null
          cp -R NetRelish.xcodeproj /tmp/committed.xcodeproj
          xcodegen generate --quiet
          diff -ru /tmp/committed.xcodeproj NetRelish.xcodeproj || { echo "::error file=project.yml::NetRelish.xcodeproj is stale — run scripts/gen-project.sh"; exit 1; }
          # XcodeGen also writes the Info.plist and entitlements files project.yml declares.
          STALE=$(git status --porcelain -- '*.entitlements' '*Info.plist')
          [ -z "$STALE" ] || { echo "$STALE"; git diff -- '*.entitlements' '*Info.plist'; echo "::error file=project.yml::an Info.plist or entitlements file is stale — run scripts/gen-project.sh"; exit 1; }
      - name: Logos are untouched
        run: shasum -a 256 design/logo.svg design/logo-cog.svg
      - name: Vendored defuddle.js matches its recorded checksum
        # The record lives in scripts/checksums/, not next to the file: all of Resources/ is
        # copied into the app bundle. A new defuddle.js needs a new checksum and a named
        # upstream version in the same pull request (scripts/checksums/README.md).
        run: shasum -a 256 -c scripts/checksums/defuddle.js.sha256

  build:
    name: Build ${{ matrix.flavor }}
    # xcode-27 is the only image with the macOS 27 SDK; macos-latest is still macOS 26.
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: AppStore
            scheme: NetRelish (App Store)
            configuration: Release-AppStore
          - flavor: Direct
            scheme: NetRelish (Direct)
            configuration: Release-Direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false   # read-only job: leave no token in .git/config
      - name: Toolchain
        run: xcodebuild -version
      - name: Build (unsigned — CI has no certificate)
        # -onlyUsePackageVersionsFromResolvedFile: build with exactly the package revisions in the
        # committed Package.resolved, as the release does. Changing a package in project.yml
        # without committing the updated lockfile fails here.
        run: |
          xcodebuild -project NetRelish.xcodeproj -scheme "${{ matrix.scheme }}" \
            -configuration "${{ matrix.configuration }}" -derivedDataPath "$DERIVED" \
            -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO -quiet build

  test:
    name: Test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false   # read-only job: leave no token in .git/config
      # Signed ad hoc, not unsigned: StoreKit's local test store (ProStoreKitTests) won't talk
      # to an unsigned app. The sandbox and app-group entitlements are left off here so the
      # tests keep the plain file access they've always had; the release jobs are unchanged.
      - name: Test (Debug-AppStore, both bundles; signed ad hoc for StoreKit's test store)
        run: |
          xcodebuild -project NetRelish.xcodeproj -scheme "NetRelish (App Store)" \
            -configuration Debug-AppStore -derivedDataPath "$DERIVED" \
            -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS= ENABLE_APP_SANDBOX=NO \
            -resultBundlePath TestResults.xcresult -quiet test
      - name: Keep the test results when they fail, so the errors can be read
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: test-results
          path: TestResults.xcresult
      - name: Render the Design Kit (light + dark)
        run: |
          "$DERIVED/Build/Products/Debug-AppStore/NetRelish.app/Contents/MacOS/NetRelish" --snapshot design-kit-snapshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: design-kit-snapshots
          path: design-kit-snapshots/*.png

  pantrykit:
    name: PantryKit package (macOS test + iOS compile)
    # The Duo companion (1.1) will consume the Pantry core as the PantryKit SwiftPM
    # package (ADR 0009) — same files as the Pantry framework target, second build
    # system. This proves the package resolves, builds and passes its tests on macOS,
    # and that every file in Sources/Pantry compiles for iOS. xcode-27 for the same
    # SDK reason as `build`, and because the package's macOS floor matches the app's.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false   # read-only job: leave no token in .git/config
      - name: Build and test (macOS)
        # The plain build before the tests is deliberate: it compiles the library
        # without testability — the graph an iOS consumer (Duo) actually gets.
        run: |
          swift build
          swift test
      - name: Compile for iOS (device SDK, no simulator or signing needed)
        # Compile-only proof against the iphoneos SDK; the deployment floor comes
        # from Package.swift (.iOS("17.0")). --triple/--sdk set SwiftPM's build
        # destination itself — injected -Xswiftc -sdk/-target flags do NOT work on
        # Xcode 27's SwiftPM, whose swift-build backend appends its own macOS
        # -sdk/-target after them and the mixed SDKs break the Foundation module
        # scan. swift build skips test targets, so Testing availability on the
        # device SDK is not in play here.
        run: |
          swift build \
            --triple arm64-apple-ios \
            --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            --scratch-path .build/ios

  gate-tests:
    name: CodeQL gate self-test
    # Ubuntu, and not xcode-27, on purpose. This tests scripts/codeql_gate.py,
    # which is pure Python and touches no Swift — and it MUST keep running while
    # the CodeQL workflow cannot build this project on the macOS image. A gate
    # whose only proof of correctness lives inside the job that is currently red
    # is not proven at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false   # read-only job: leave no token in .git/config
      - name: The gate enforces what it claims to
        run: python3 -m unittest discover -s scripts/tests -v
