name: Zest tests

on:
  pull_request:
    paths: ['zest/**', '.github/workflows/zest-tests.yml']
  push:
    branches: [main]
    paths: ['zest/**', '.github/workflows/zest-tests.yml']

# Tests only: npm and Playwright's packages run here, so the token can only read.
permissions:
  contents: read

concurrency:
  group: zest-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Suites + contrast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: zest/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false   # read-only job: leave no token in .git/config
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zest/tests/package-lock.json
      - run: npm ci
      # The runner's apt mirrors fail to resolve now and then; retry before giving up.
      - run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Browser install failed (attempt $attempt of 3)"
            sleep 15
          done
          exit 1
      - run: npm test
