name: Zest tests

on:
  pull_request:
    paths: ['zest/**']
  push:
    branches: [main]
    paths: ['zest/**']

jobs:
  test:
    name: Suites + contrast
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zest/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zest/tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
