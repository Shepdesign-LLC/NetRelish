name: CodeQL

# ⚠️ THIS JOB IS CURRENTLY EXPECTED TO FAIL. Do not re-diagnose it from scratch.
#
# ONE failure with a knock-on, though it read as two for a while. Read out of
# the job logs of runs 36092189970 (932b589), 36092546432 (6682385) and
# 36093785096 (8ad8ad4).
#
#   A. Something architecture-shaped, INTERMITTENT. The MECHANISM IS NOT
#      ESTABLISHED — what follows is observation, and the first theory that
#      fits it is already dead. Read the MEASURED block below before forming
#      another one.
#
#      OBSERVED. The tracer injects libtrace.dylib via DYLD_INSERT_LIBRARIES,
#      out of the action's arm64 install path:
#
#        DYLD_INSERT_LIBRARIES: …/CodeQL/2.27.1/arm64/codeql/tools/osx64/libtrace.dylib
#
#      the traced build compiles an x86_64 slice:
#
#        SwiftCompile normal x86_64 (in target 'KeyboardShortcuts')
#
#      and processes the build spawns die with EBADARCH:
#
#        compiler plugin '…/usr/bin/swift-plugin-server' could not be loaded:
#        Bad CPU type in executable
#
#      which is why @State does not expand inside KeyboardShortcuts — the log
#      names the macro, see B.
#
#      The build is universal because nothing in project.yml or the xcconfigs
#      sets ARCHS or ONLY_ACTIVE_ARCH, so the Release configurations take
#      ARCHS_STANDARD (arm64 + x86_64).
#
#      NOT ESTABLISHED, and do not re-derive it from the two lines above: that
#      an arm64-only library was refused by an x86_64 process. That was the
#      first reading, it was never measured, and MEASURED below falsifies it —
#      libtrace.dylib is FAT, carrying both slices. The `/arm64/` in that path
#      names the CodeQL bundle's own build, not the library's architecture.
#      What IS measured is the reverse mismatch: Xcode 27's toolchain binaries
#      are arm64-only while the job's shell is Rosetta x86_64. That is the
#      environment and not the cause — the same binaries run fine untraced.
#      What the tracer adds on top of it is the open question.
#
#      It is INTERMITTENT, which earlier notes had wrong: "Bad CPU type"
#      appears 14 times on 932b589 and ZERO times on 6682385, two runs five
#      minutes apart on different runners. Do not read one clean run as fixed.
#
#   B. Its knock-on, CONSISTENT — and NOT an independent bug; see below.
#
#      Four errors in the same dependency, in BOTH runs, only under the traced
#      build:
#
#        KeyboardShortcuts/Sources/KeyboardShortcuts/ViewModifiers.swift:114:20:
#        error: cannot use mutating member on immutable value: 'self' is immutable
#
#      These were always there and were simply buried under A's fourteen lines.
#      When A produced no output at all (6682385) they were the whole failure,
#      which is why they looked independent. They are not: @State is a macro, run
#      36093785096 caught the plugin failing to expand it by name, and these are
#      what that failure looks like downstream. Fixing A fixes these.
#
# Either way the traced build dies with exit 65 at "Build both flavours". The
# untraced Build AppStore / Build Direct / Test jobs are green: the app is fine,
# only the traced build is not.
#
# On CodeQL versions, stated no more strongly than the evidence allows: the job
# logs show the action installing 2.27.1, so that is what CI runs. An earlier
# note here claimed this SHA pins 2.27.0 through the action's own
# src/defaults.json — that was asserted, never observed, and the logs contradict
# it. There is still deliberately no `tools:` line, because nothing yet ties the
# failure to a CodeQL version — A's mechanism is not established at all, so a
# version can be neither ruled in nor ruled out on the evidence here, and B is
# downstream of A rather than a second thing to pin.
#
# Tested and ruled out on 2026-09-25 — do not spend a cycle on either. Note
# these were run BEFORE the arch mismatch above was understood, so they rule out
# two approaches, not the whole problem.
#
#   1. Excluding swift-plugin-server from tracing. The tracer takes an extra
#      Lua config: `codeql database init --extra-tracing-config=FILE`, which is
#      what sets CODEQL_TRACER_EXTRA_CONFIG, and which a workflow reaches
#      through CODEQL_ACTION_EXTRA_OPTIONS. A matcher with `trace = false` —
#      the shape upstream's swift config already uses for sandbox-exec — does
#      fire; the tracer log says "Disabling tracing for language swift".
#
#      It does not help, because it is the wrong lever. `trace = false` means
#      "run no extractor for this process", NOT "do not inject into it". The
#      preload variable is set once, in the environment of the build command,
#      and inherited by every descendant — so the library is loaded into the
#      child before any Lua runs, and an arch-incompatible child dies in dyld
#      before the matcher is ever consulted. Reproduced against CodeQL 2.27.0
#      locally, which is NOT the 2.27.1 CI installs — the Lua contract is
#      documented in tools/tracer/base.lua and unchanged between them, but the
#      reproduction was on the other patch version:
#      a child matched by `trace = false` still saw the preload variable set,
#      identical to an unmatched control.
#
#      That is also why sandbox-exec died with EBADARCH while already excluded
#      upstream, and why removing its SPAWN (the two steps at the top of the
#      job below) is what fixed it, rather than excluding it from tracing.
#
#      Caveat on the evidence: that reproduction was on Linux, where the
#      variable is LD_PRELOAD rather than DYLD_INSERT_LIBRARIES. The Lua
#      semantics are shared and the sandbox-exec history on this runner agrees
#      with it, but the macOS injection path is inferred, not observed.
#
#   2. Skipping the build. Swift has no `none` build mode — the extractor
#      declares `autobuild` and `manual` only (swift/codeql-extractor.yml in
#      the 2.27.0 bundle) — so a traced build is mandatory and there is no
#      way around the tracer at all.
#
# TRIED AND WRONG, 2026-09-25, run 36093785096: building one architecture.
# ONLY_ACTIVE_ARCH=YES produced a pure arm64 compile — the flag did exactly what
# it claimed — and "Bad CPU type" still occurred. The mismatch theory behind it
# is also dead on its own terms: libtrace.dylib is a FAT binary carrying both
# x86_64 and arm64, read straight out of the 2.27.1 osx64 bundle's Mach-O fat
# header. It was never missing a slice for the build. That theory was inferred
# from the "…/CodeQL/2.27.1/arm64/…" path and a "SwiftCompile normal x86_64"
# line, and never measured, which is the same mistake as the version claim above.
#
# That run did settle B, though, and it is not a second bug: @State is itself a
# macro. The log names it — external macro implementation type
# 'SwiftUIMacros.StateMacro' could not be found for macro 'State()' — expanded by
# the same plugin server, so when the plugin will not load @State does not apply,
# and the "'self' is immutable" errors are its direct consequence. ONE blocker,
# not two, and B needs no separate fix.
#
# MEASURED, run 36094598763. It is not arm64e, and it is not a missing slice:
#
#   runner (uname -m):    x86_64      ← the job's shell is translated
#   swift-plugin-server:  arm64       ← arm64 ONLY
#   swift-frontend:       arm64       ← arm64 ONLY
#   libtrace.dylib:       x86_64 arm64
#
# Xcode 27 dropped the x86_64 slices from its toolchain binaries while the runner
# shell is still Rosetta x86_64. That is the ENVIRONMENT, and it is not the
# mechanism — do not let it read as one. It cannot be, on its own terms: those
# same arm64-only binaries run fine untraced, which is why ci.yml is green. So
# "arm64-only toolchain" alone does not distinguish the traced build from the
# untraced one, and what the tracer adds on top of it is exactly the open
# question flagged in A.
#
# NOT FIXED, and a false alarm worth reading before trying anything: `arch
# -arm64` on the build step appeared to fix it in run 36095284643 and did not.
# /usr/bin/arch is SIP-protected, dyld purges DYLD_* across a restricted exec,
# and the build simply ran untraced. Run 36095774560 then completed the build
# and failed at finalize with
#
#   Error: CodeQL could not process any code written in Swift.
#
# which is the only one of its symptoms that "the tracer was off" explains and
# nothing else does. Three of the four signals looked like success:
#
#                        c5d7d6a      arch -arm64 (untraced)
#   Bad CPU type              2                           0
#   'self' is immutable       4                           0
#   build                  fail                     SUCCEEDED
#   code extracted            -                        NONE
#
# Had finalize not refused an empty database this would have been a green CodeQL
# job that had seen no code — the fail-open the gate exists to prevent. Do not
# reach for `arch` again without first PROVING DYLD_INSERT_LIBRARIES still
# reaches the build — print it from inside the step and read it, rather than
# inferring from a green job. A probe step that does exactly that is on the
# ci/codeql-native-arch branch; it is not on main, deliberately, because this
# job is expected to fail and an extra step is noise until someone is working
# on it.
#
# Nothing here needs changing when it is fixed upstream: the job simply starts
# passing. PR #22 has the investigation's history; where it and this comment
# disagree, this comment is the later measurement and wins.
#
# Advanced setup, not default setup. CodeQL analyses Swift by BUILDING it, and
# default setup would run that build on a GitHub-hosted macos-latest — which is
# still macOS 26 and has no macOS 27 SDK (see the note on `runs-on` in ci.yml).
# The build would fail on every push. This runs on the same xcode-27 image the
# rest of CI uses, and builds the same way.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. New queries ship regularly and find old bugs in unchanged code;
    # without this, the analysis only ever sees what a push happens to touch.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: xcode-27
    permissions:
      contents: read
      # Required: this is how the analysis uploads its results to the Security
      # tab. Nothing else here needs write. (actions: read is only needed on
      # private repositories; this one is public.)
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      # Resolve SwiftPM dependencies BEFORE CodeQL starts tracing.
      #
      # The tracer sets DYLD_INSERT_LIBRARIES and injects libtrace.dylib into every
      # process the build spawns. SwiftPM compiles package manifests inside
      # `sandbox-exec`, and that spawn then dies with EBADARCH:
      #
      #   posix_spawn error: Bad CPU type in executable (86), ["/usr/bin/sandbox-exec", ...]
      #
      # It is the tracer, not the packages: Build AppStore, Build Direct and Test run
      # the same xcodebuild untraced on the same commit and pass in ~2 minutes.
      # Resolving here populates SourcePackages/ and SwiftPM's manifest cache outside
      # the tracer, leaving the traced build nothing to do but compile. The
      # -derivedDataPath must match the build step's or the checkouts are not found.
      - name: Resolve package dependencies (untraced)
        run: |
          xcodebuild -project NetRelish.xcodeproj -scheme "NetRelish (App Store)" \
            -derivedDataPath .build/DerivedData -resolvePackageDependencies

      # Proven necessary, and a real trade-off — read before deleting or copying.
      #
      # WHY: CodeQL's tracer injects libtrace.dylib into every spawned process.
      # SwiftPM compiles package manifests inside sandbox-exec, and that spawn
      # dies with EBADARCH. Four runs died here. Pre-resolving above is necessary
      # but not sufficient: the traced build reloads the manifests regardless,
      # most likely because SwiftPM's manifest cache key includes the environment
      # and DYLD_INSERT_LIBRARIES changes it — so a cache warmed outside the
      # tracer can never be hit inside it, and the sandbox itself has to go.
      # With this step the build and extraction complete.
      #
      # WHAT IT COSTS: manifest evaluation loses its isolation, so Package.swift
      # code from a dependency — or from a pull request that edits one — runs
      # unsandboxed here. Three things bound that: the runner is ephemeral and
      # the default dies with it; this workflow's token is `contents: read`; and
      # the job already compiles the PR's own code through xcodebuild, which runs
      # arbitrary build phases anyway, so the marginal exposure is small.
      #
      # It is still a downgrade, and it is here because the alternative is no
      # Swift scanning at all. Revisit when the xcode-27 image or CodeQL's tracer
      # stops requiring it; this step should not outlive that.
      - name: Disable SwiftPM's manifest sandbox (see comment — trade-off)
        run: defaults write com.apple.dt.Xcode IDEPackageSupportDisableManifestSandbox -bool YES

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        id: init
        with:
          languages: swift
          # Adds .github/codeql on top of the default suite — it does not replace
          # it. `disable-default-queries` stays false, so both run.
          queries: ./.github/codeql

      # Compile the custom queries against the CodeQL the runner actually uses,
      # BEFORE spending eight minutes on a build.
      #
      # A broken query otherwise surfaces as "CodeQL job status was
      # configuration error" only after the whole extraction, with the real
      # message buried under a few hundred lines of extractor diagnostics. This
      # turns that into a readable failure in seconds.
      #
      # It also prints the CodeQL version, which is NOT necessarily the one the
      # queries were authored against: the action is pinned by SHA, the CLI it
      # downloads is not, and qlpack.yml takes codeql/swift-all at "*". If those
      # ever diverge enough to matter, this step is where it shows up.
      - name: Compile the custom queries (fail fast, readable error)
        run: |
          "${{ steps.init.outputs.codeql-path }}" version --format=terse
          "${{ steps.init.outputs.codeql-path }}" query compile --warnings=error \
            --threads=0 .github/codeql/

      # Not autobuild: this project builds through a named scheme and
      # configuration, exactly as ci.yml does. Signing is off because CI holds
      # no certificate.
      #
      # BOTH flavours, into one database. CodeQL only sees what the traced build
      # compiles, so an AppStore-only build leaves every `#if DIRECT_BUILD` line
      # out of the database entirely — and that is exactly where CLAUDE.md puts
      # the direct-build licence activation, and where Pickle's GitHub OAuth
      # device flow will live. A gate blind to the riskiest code in the project
      # is worse than no gate, because it reads as coverage. Consecutive traced
      # commands collect into the same database, so this is two invocations, not
      # two jobs.
      - name: Build both flavours (unsigned — CI has no certificate)
        run: |
          xcodebuild -project NetRelish.xcodeproj -scheme "NetRelish (App Store)" \
            -configuration Release-AppStore -derivedDataPath .build/DerivedData \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet build
          xcodebuild -project NetRelish.xcodeproj -scheme "NetRelish (Direct)" \
            -configuration Release-Direct -derivedDataPath .build/DerivedData \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet build

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:swift"
          output: .codeql-results

      # analyze uploads findings; it never fails the job on them, and there is
      # no `fail-on` input. Without this step the gate is a report, not a gate —
      # the CodeQL check can sit green with an alert on it, so requiring it in
      # branch protection would still let a fifth endpoint merge. Gating
      # repo-side works too (code scanning's check-failure severity, or a
      # ruleset), but that is a console toggle a fork, a clone or a forgetful
      # afternoon loses. This travels with the repo.
      #
      # The logic is in scripts/codeql_gate.py, not inline here. It has had
      # twenty-eight defects — five before it was extracted, and twenty-three more found
      # by review of the branch that extracted it — every one in its
      # enforcement rather than its design, and every one failing OPEN. A
      # heredoc cannot be tested, so the first five were caught by a human
      # reading it, or not caught at all. It now has a suite in scripts/tests/
      # that the `CodeQL gate self-test` job in ci.yml runs on every push,
      # including while THIS job cannot build the project. The module header
      # lists all twenty-eight; read it before adding anything here.
      #
      # Only the gate fails the build. netrelish/remote-capable-url-read has two
      # legitimate baseline hits; failing on it would teach everyone to ignore a
      # red CodeQL job, which is the opposite of what the split was for.
      - name: Fail if the gate fired
        run: python3 scripts/codeql_gate.py .codeql-results
