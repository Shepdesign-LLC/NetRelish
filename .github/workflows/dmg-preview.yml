name: Disk image preview

# Builds the disk image from an unsigned Direct build and shows the window it opens to, so a
# change to it can be judged from the PR. The release job makes the real one the same way
# (scripts/dmg/make-dmg.sh), then signs, notarizes and staples it. ADR 0019.
#
# The artifact "disk-image-preview" holds:
#   preview.png / preview@2x.png  the window, drawn from the same layout Finder uses
#   finder.png                    a capture of Finder showing it, when the runner allows one
#   NetRelish-preview.dmg         the image itself (unsigned: open it with Control-click, Open)

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'scripts/dmg/**'
      - 'design/logo.svg'
      - 'Resources/AppIcon.icns'
      - '.github/workflows/dmg-preview.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

env:
  DERIVED: .build/DerivedData

jobs:
  preview:
    name: Disk image
    # xcode-27 is the only image with the macOS 27 SDK.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - name: Build the app (unsigned — CI has no certificate)
        run: |
          xcodebuild -project NetRelish.xcodeproj -scheme "NetRelish (Direct)" -configuration Release-Direct \
            -derivedDataPath "$DERIVED" -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Make the disk image
        env:
          MAKE_DMG_UNSIGNED: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          scripts/dmg/make-dmg.sh "$DERIVED/Build/Products/Release-Direct/NetRelish.app" \
            "$RUNNER_TEMP/out/NetRelish-preview.dmg" --preview "$RUNNER_TEMP/out"

      - name: Open it in Finder and capture the window
        # A capture needs the runner to allow screen recording; the drawn preview above doesn't.
        continue-on-error: true
        run: |
          hdiutil attach "$RUNNER_TEMP/out/NetRelish-preview.dmg"
          open /Volumes/NetRelish
          sleep 5
          cat > "$RUNNER_TEMP/window.swift" <<'SWIFT'
          import CoreGraphics
          let all = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          let finder = all.filter { ($0[kCGWindowOwnerName as String] as? String) == "Finder" && ($0[kCGWindowLayer as String] as? Int) == 0 }
          let window = finder.first { ($0[kCGWindowName as String] as? String) == "NetRelish" } ?? finder.first
          guard let id = window?[kCGWindowNumber as String] as? Int else { exit(1) }
          print(id)
          SWIFT
          ID=$(swift "$RUNNER_TEMP/window.swift")
          screencapture -o -x -l "$ID" "$RUNNER_TEMP/out/finder.png"
          hdiutil detach /Volumes/NetRelish -quiet || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: disk-image-preview
          path: ${{ runner.temp }}/out
          if-no-files-found: error
