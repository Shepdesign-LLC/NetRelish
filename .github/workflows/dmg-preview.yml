name: Disk image preview

# Builds the disk image from an unsigned Direct build and shows the window it opens to, so a
# change to it can be judged from the PR. The release job makes the real one the same way
# (scripts/dmg/make-dmg.sh), then signs, notarizes and staples it. ADR 0019.
#
# The artifact "disk-image-preview" holds:
#   preview.png / preview@2x.png  the window, drawn from the same layout Finder uses
#   finder.png                    a capture of Finder showing it, when the runner allows one
#   NetRelish-preview.dmg         the image itself (signed ad hoc, not notarized: Control-click, Open)

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'scripts/dmg/**'
      - 'design/logo.svg'
      - 'Resources/AppIcon.icns'
      - '.github/workflows/dmg-preview.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      print_preview:
        description: Also write the pictures into the job log, base64 (for a reviewer who can't open artifacts)
        type: boolean
        default: false

# One preview per pull request. A disk-image change is judged by looking at the picture and
# nudging the layout, so a run in flight is superseded by the next push — and this one is on
# a paid larger runner (about six minutes a run). The fallback is unique per run and the
# cancel is gated on the event, so a workflow_dispatch is never cancelled; this workflow has
# no push and no schedule trigger, so there is no run on main to protect. Same shape as
# ci.yml and codeql.yml (ADR 0037).
concurrency:
  group: dmg-preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DERIVED: .build/DerivedData

jobs:
  preview:
    name: Disk image
    # xcode-27 is the only image with the macOS 27 SDK. It is also a GitHub-hosted LARGER
    # runner, billed per minute even on this public repository.
    runs-on: xcode-27
    # The build and the image together take about six minutes; the default is 360, and the
    # Finder step below can wait on a window that never appears. Fail at 25 instead of
    # burning six hours of the dearest runner GitHub sells (ADR 0037).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false   # read-only job: leave no token in .git/config

      - name: Build the app (unsigned — CI has no certificate)
        run: |
          xcodebuild -project NetRelish.xcodeproj -scheme "NetRelish (Direct)" -configuration Release-Direct \
            -derivedDataPath "$DERIVED" -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Sign it ad hoc, so the image's signature check runs as in a release
        run: codesign --force --deep --sign - "$DERIVED/Build/Products/Release-Direct/NetRelish.app"

      - name: Make the disk image
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          scripts/dmg/make-dmg.sh "$DERIVED/Build/Products/Release-Direct/NetRelish.app" \
            "$RUNNER_TEMP/out/NetRelish-preview.dmg" --preview "$RUNNER_TEMP/out"

      - name: Open it in Finder and capture the window
        # A capture needs the runner to allow screen recording; the drawn preview above doesn't.
        # continue-on-error turns a FAILURE into a missing finder.png, but it cannot bound a
        # HANG: hdiutil attach and open both wait on Finder. Three minutes on a step that
        # takes about thirty seconds, then give up the capture and still upload the image and
        # the drawn preview — finder.png is already optional, so nothing verified is lost.
        continue-on-error: true
        timeout-minutes: 3
        run: |
          hdiutil attach "$RUNNER_TEMP/out/NetRelish-preview.dmg"
          open /Volumes/NetRelish
          sleep 5
          cat > "$RUNNER_TEMP/window.swift" <<'SWIFT'
          import CoreGraphics
          let all = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          let finder = all.filter { ($0[kCGWindowOwnerName as String] as? String) == "Finder" && ($0[kCGWindowLayer as String] as? Int) == 0 }
          let window = finder.first { ($0[kCGWindowName as String] as? String) == "NetRelish" } ?? finder.first
          guard let id = window?[kCGWindowNumber as String] as? Int else { exit(1) }
          print(id)
          SWIFT
          ID=$(swift "$RUNNER_TEMP/window.swift")
          screencapture -o -x -l "$ID" "$RUNNER_TEMP/out/finder.png"
          hdiutil detach /Volumes/NetRelish -quiet || true

      - name: Write the pictures into the log
        if: ${{ inputs.print_preview }}
        run: |
          cd "$RUNNER_TEMP/out"
          for f in preview.png finder.png; do
            [ -f "$f" ] || continue
            echo "----- BEGIN $f -----"; base64 -i "$f" | fold -w 4000; echo "----- END $f -----"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: disk-image-preview
          path: ${{ runner.temp }}/out
          if-no-files-found: error
